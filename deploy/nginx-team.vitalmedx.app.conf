# /etc/nginx/sites-available/team.vitalmedx.app
# بعد النسخ: ln -s ../sites-available/team.vitalmedx.app /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# وبعدين: certbot --nginx -d team.vitalmedx.app
server {
    listen 80;
    server_name team.vitalmedx.app;
    client_max_body_size 60m;   # ملفات PDF
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
